name: Release

on:
  push:
    tags:
      - "v*"
  # Dry-run: build + verify the packaged gem without publishing anything.
  workflow_dispatch:

jobs:
  release:
    name: Build and publish gem
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for RubyGems trusted publishing
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      MISE_RUBY_VERSION: "4.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4

      # Monorepo (I51 judge ruling): a nested gemspec is unbuildable from
      # the repo root — `gem build` must run inside gems/completions.
      - name: Build gem
        working-directory: gems/completions
        run: |
          gem build fast-completions.gemspec
          mkdir -p ../../pkg/
          mv *.gem ../../pkg/

      # The pre-release rule (fast-* family), monorepo-adapted: install
      # the built .gem into an isolated GEM_HOME and exercise it from there
      # — the checkout's lib/ is never on the load path — so a file missing
      # from spec.files or a require-path mistake fails here, not after
      # publishing. Unlike fast-uuid this gem HAS a runtime dependency
      # (async-http), so the install resolves it from rubygems (no
      # --local): isolation of the packaged code, not of the network.
      - name: Verify the packaged gem
        run: |
          export GEM_HOME="$RUNNER_TEMP/gemhome"
          gem install --no-document pkg/fast-completions-*.gem
          cd "$RUNNER_TEMP"
          ruby -e '
            require "fast/completions"
            require "fast/completions/sse"
            client = Fast::Completions::Client.new(base_url: "http://127.0.0.1:1", api_key: "ci-smoke")
            raise "client not constructible" if client.nil?
            puts Fast::Completions::VERSION
          '

      # Trusted publishing: no API token. Auth is a short-lived OIDC
      # credential minted at run time, scoped to this repo + workflow
      # (rubygems.org trusted publisher: jetpks/fast-llm, release.yml).
      - name: Configure RubyGems credentials
        if: ${{ fromJSON(env.IS_TAG) }}
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Publish to RubyGems
        if: ${{ fromJSON(env.IS_TAG) }}
        run: gem push pkg/fast-completions-*.gem

      - name: Smoke-test the published gem
        if: ${{ fromJSON(env.IS_TAG) }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            gem install fast-completions --version "$version" && break
            echo "not indexed yet (attempt $attempt) — retrying in 15s"
            sleep 15
          done
          ruby -e 'require "fast/completions"; puts Fast::Completions::VERSION' | grep -Fx "$version"

      - name: Create GitHub Release
        if: ${{ fromJSON(env.IS_TAG) }}
        uses: softprops/action-gh-release@v3
        with:
          files: pkg/*.gem
          generate_release_notes: true
          # Prerelease tags (e.g. v0.1.0.pre.1) must not be marked "latest".
          prerelease: ${{ contains(github.ref_name, '.rc') || contains(github.ref_name, '.beta') || contains(github.ref_name, '.alpha') || contains(github.ref_name, '.pre') || contains(github.ref_name, '-') }}
